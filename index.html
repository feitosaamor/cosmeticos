<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feitos a Amor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  :root{ --blue:#1C8DE0; --blue-deep:#0B5FA8; --ink:#0F2A44; --soft:#5B7894; --line:#D9E6F5; --bg:#F2F7FD; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Work Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  .hero{ background:linear-gradient(160deg,var(--blue-deep) 0%,var(--blue) 100%); color:#fff; padding:44px 24px 56px; text-align:center; }
  .hero svg{ width:52px; height:48px; margin-bottom:12px; opacity:.95; }
  .hero h1{ font-family:'Anton',sans-serif; font-weight:400; font-size:26px; text-transform:uppercase; letter-spacing:.02em; }
  .hero p{ font-size:13.5px; opacity:.8; margin-top:6px; }
  .wrap{ max-width:520px; margin:-28px auto 0; padding:0 16px 40px; }
  .card{ display:flex; align-items:center; gap:16px; width:100%; text-align:left; background:#fff; border:1px solid var(--line);
         border-radius:18px; padding:20px 18px; margin-bottom:14px; cursor:pointer; text-decoration:none; color:inherit;
         box-shadow:0 6px 18px rgba(11,95,168,.08); transition:transform .12s; }
  .card:active{ transform:scale(.985); }
  .ico{ width:54px; height:54px; border-radius:14px; background:var(--bg); border:1px solid var(--line);
        display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
  .card b{ display:block; font-family:'Anton',sans-serif; font-weight:400; font-size:18px; text-transform:uppercase; letter-spacing:.02em; }
  .card span{ display:block; font-size:12.5px; color:var(--soft); margin-top:3px; }
  .arrow{ margin-left:auto; color:var(--blue); font-size:22px; }
  .quem{ text-align:center; font-size:12.5px; color:var(--soft); margin:22px 0 10px; }
  .sair{ display:block; margin:0 auto; background:none; border:1px solid var(--line); color:var(--blue-deep);
         border-radius:12px; padding:10px 22px; font-weight:600; font-size:13.5px; cursor:pointer; }
  /* login */
  #login{ display:none; position:fixed; inset:0; z-index:50; background:linear-gradient(160deg,var(--blue-deep) 0%,var(--blue) 100%);
          align-items:center; justify-content:center; padding:24px; }
  .lk{ width:100%; max-width:320px; text-align:center; }
  .lk svg{ width:56px; height:52px; margin-bottom:16px; }
  .lk h2{ font-family:'Anton',sans-serif; font-weight:400; font-size:22px; text-transform:uppercase; color:#fff; margin-bottom:6px; }
  .lk p{ font-size:13.5px; color:rgba(255,255,255,.8); margin-bottom:22px; }
  .lk input{ width:100%; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:14px;
             padding:14px 16px; font-size:16px; color:#fff; outline:none; margin-bottom:12px; font-family:inherit; }
  .lk input::placeholder{ color:rgba(255,255,255,.55); }
  .lk .err{ display:none; color:#FFD2D2; font-size:12.5px; margin-bottom:12px; }
  .lk button{ width:100%; background:#fff; color:var(--blue-deep); border:none; border-radius:14px; padding:14px; font-weight:700; font-size:14.5px; cursor:pointer; }
  body.logado #login{ display:none !important; }
  body:not(.logado) .hero, body:not(.logado) .wrap{ display:none; }
</style>
</head>
<body>

<div id="login">
  <div class="lk">
    <svg viewBox="0 0 100 92" fill="none"><path d="M62 8C50 8 41 16 38 26C35 16 24 9 13 12C0 16 -3 32 6 45C15 58 32 70 38 80C44 70 61 58 70 45C79 32 76 16 63 12C62.6 11.9 62.3 11.8 62 8Z" fill="#FFFFFF"/></svg>
    <h2>Feitos a Amor</h2>
    <p>Entre com seu e-mail e senha</p>
    <input type="email" id="email" placeholder="e-mail" autocomplete="username" inputmode="email">
    <input type="password" id="senha" placeholder="senha" autocomplete="current-password">
    <div class="err" id="erro">E-mail ou senha incorretos.</div>
    <button id="entrar">Entrar</button>
  </div>
</div>

<div class="hero">
  <svg viewBox="0 0 100 92" fill="none"><path d="M62 8C50 8 41 16 38 26C35 16 24 9 13 12C0 16 -3 32 6 45C15 58 32 70 38 80C44 70 61 58 70 45C79 32 76 16 63 12C62.6 11.9 62.3 11.8 62 8Z" fill="#FFFFFF"/></svg>
  <h1>Feitos a Amor</h1>
  <p>O que você quer fazer agora?</p>
</div>

<div class="wrap">
  <a class="card" href="pdv.html"><div class="ico">🛒</div><div><b>PDV</b><span>Vendas, produtos, estoque e clientes</span></div><div class="arrow">›</div></a>
  <a class="card" href="producao.html"><div class="ico">🧪</div><div><b>Produção</b><span>Insumos, receitas, custos e lotes</span></div><div class="arrow">›</div></a>
  <a class="card" href="historico.html"><div class="ico">📊</div><div><b>Histórico de vendas</b><span>Painel gerencial por período e ponto de venda</span></div><div class="arrow">›</div></a>
  <div class="quem" id="quem"></div>
  <button class="sair" id="sair">Sair</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://gbqrdbmsmaojjxpwzbml.supabase.co";
  const SUPABASE_KEY = "sb_publishable_bLro1lcu4E278czi_8EDCw_fALZ3sNT";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const emailI = document.getElementById("email"), senhaI = document.getElementById("senha");
  const btn = document.getElementById("entrar"), erro = document.getElementById("erro");
  const login = document.getElementById("login");

  function mostrarLogin(msg) {
    document.body.classList.remove("logado");
    login.style.display = "flex";
    if (msg) { erro.textContent = msg; erro.style.display = "block"; senhaI.value = ""; }
  }

  async function entrar() {
    const u = (await sb.auth.getUser()).data.user;
    const m = u ? await sb.from("membros").select("papel").eq("user_id", u.id).maybeSingle() : { data: null };
    if (!m.data) { await sb.auth.signOut(); mostrarLogin("Este e-mail não tem permissão para usar o app."); return; }
    document.getElementById("quem").textContent = u.email + " · " + (m.data.papel === "admin" ? "administrador" : "operador");
    login.style.display = "none";
    document.body.classList.add("logado");
  }

  async function tentar() {
    if (!emailI.value.trim() || !senhaI.value) { mostrarLogin("Preencha e-mail e senha."); return; }
    btn.disabled = true; btn.textContent = "Entrando...";
    const r = await sb.auth.signInWithPassword({ email: emailI.value.trim(), password: senhaI.value });
    btn.disabled = false; btn.textContent = "Entrar";
    if (r.error) { mostrarLogin("E-mail ou senha incorretos."); return; }
    entrar();
  }

  btn.addEventListener("click", tentar);
  senhaI.addEventListener("keydown", function (e) { if (e.key === "Enter") tentar(); });
  emailI.addEventListener("keydown", function (e) { if (e.key === "Enter") senhaI.focus(); });
  document.getElementById("sair").addEventListener("click", async function () { await sb.auth.signOut(); location.reload(); });

  sb.auth.getSession().then(function (r) {
    if (r.data && r.data.session) entrar();
    else { mostrarLogin(); setTimeout(function () { emailI.focus(); }, 100); }
  });
</script>
</body>
</html>
